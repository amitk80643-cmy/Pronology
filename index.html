<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date of Birth & Destiny Vibration Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      max-width: 480px;
      width: 100%;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 {
      color: #fbbf24;
      text-align: center;
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p.desc {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 24px;
    }
    label { 
      font-size: 14px; 
      font-weight: 600; 
      color: #cbd5e1; 
      display: block;
      margin-bottom: 6px;
    }
    input[type="date"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    input[type="date"]:focus { 
      border-color: #fbbf24; 
    }
    button.calc-btn {
      width: 100%;
      background: #fbbf24;
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    button.calc-btn:hover { 
      background: #f59e0b; 
    }
    .result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #0f172a;
      border-radius: 8px;
      border-left: 4px solid #fbbf24;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      font-size: 15px;
    }
    .calc-steps {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      text-align: right;
    }
    .planet-info {
      margin-top: 14px;
      padding: 12px;
      background: #1e293b;
      border-radius: 6px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .cta {
      margin-top: 24px;
      text-align: center;
      border-top: 1px solid #334155;
      padding-top: 20px;
    }
    .wa-btn {
      display: inline-block;
      width: 100%;
      background: #22c55e;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>✨ DOB Vibration Calculator</h1>
  <p class="desc">Calculate your Birth Number (Mulank) & Destiny Number (Bhagyank)</p>

  <label for="dob">Select Date of Birth:</label>
  <input type="date" id="dob" />
  
  <button class="calc-btn" onclick="analyzeDOB()">Calculate Vibrations</button>

  <div id="output" class="result">
    <div class="stat-row">
      <span>Birth Number (Day / Mulank):</span>
      <strong id="birthNum" style="color:#fbbf24; font-size:18px;">-</strong>
    </div>
    <div id="birthStep" class="calc-steps"></div>

    <div class="stat-row" style="margin-top: 12px;">
      <span>Destiny Number (Total / Bhagyank):</span>
      <strong id="destinyNum" style="color:#38bdf8; font-size:18px;">-</strong>
    </div>
    <div id="destinyStep" class="calc-steps"></div>

    <div id="planetDetails" class="planet-info"></div>
  </div>

  <div class="cta">
    <p style="font-size: 14px; color: #94a3b8; margin: 0 0 10px 0;">Need a personalized name correction or full report?</p>
    <!-- Change 919876543210 to your actual WhatsApp phone number -->
    <a id="waLink" href="https://wa.me/919876543210" class="wa-btn" target="_blank">
      💬 Consult on WhatsApp
    </a>
  </div>
</div>

<script>
  const planetMap = {
    1: { planet: "Sun (Surya)", trait: "Leadership, independence, dynamic willpower, and authority." },
    2: { planet: "Moon (Chandra)", trait: "Intuition, peace, emotional intelligence, creativity, and diplomacy." },
    3: { planet: "Jupiter (Guru)", trait: "Wisdom, expansion, knowledge, teaching, and ambition." },
    4: { planet: "Rahu", trait: "Practicality, unconventional thinking, sudden growth, and intellect." },
    5: { planet: "Mercury (Budh)", trait: "Communication, commerce, adaptability, quick wit, and calculation." },
    6: { planet: "Venus (Shukra)", trait: "Luxury, harmony, art, beauty, relationship flow, and charm." },
    7: { planet: "Ketu", trait: "Deep analysis, research, intuition, wisdom, and spiritual curiosity." },
    8: { planet: "Saturn (Shani)", trait: "Discipline, patience, hard work, justice, and long-term success." },
    9: { planet: "Mars (Mangal)", trait: "Courage, energy, leadership drive, vitality, and action." }
  };

  function reduceToSingleDigit(num) {
    while (num > 9) {
      num = String(num).split('').reduce((a, b) => Number(a) + Number(b), 0);
    }
    return num;
  }

  function analyzeDOB() {
    const dobVal = document.getElementById("dob").value; // Format: YYYY-MM-DD

    if (!dobVal) {
      alert("Please select a valid Date of Birth.");
      return;
    }

    const [year, month, day] = dobVal.split('-');

    // 1. Birth Number (Day / Mulank)
    const birthNumber = reduceToSingleDigit(Number(day));

    // 2. Destiny Number (Total / Bhagyank)
    const allDigits = (day + month + year).split('').map(Number);
    const sumAll = allDigits.reduce((acc, curr) => acc + curr, 0);
    const destinyNumber = reduceToSingleDigit(sumAll);
    const
    // Update Output
    document.getElementById("birthNum").textContent = birthNumber;
    document.getElementById("birthStep").textContent = `Day ${day} → ${birthNumber}`;

    document.getElementById("destinyNum").textContent = destinyNumber;
    document.getElementById("destinyStep").textContent = `Total Sum: ${sumAll} → ${destinyNumber}`;
    const rulingPlanet = planetMap[birthNumber];
    document.getElementById("planetDetails").innerHTML = `
      <strong>Ruling Planet:</strong> ${rulingPlanet.planet}<br>
      <strong>Core Vibrations:</strong> ${rulingPlanet.trait}
    `;

    // WhatsApp Direct Message Setup
    const waText = encodeURIComponent(`Hi, my Date of Birth is ${day}-${month}-${year}. My Birth No is ${birthNumber} and Destiny No is ${destinyNumber}. I want a detailed consultation.`);
    document.getElementById("waLink").href = `https://wa.me/919876543210?text=${waText}`;

    document.getElementById("output").style.display = "block";
  }
</script>

</body>
</html>
