<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divine Pronology & Name Vibration Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      max-width: 520px;
      width: 100%;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 {
      color: #fbbf24;
      text-align: center;
      font-size: 24px;
      margin-top: 0;
    }
    p.desc {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    label { font-size: 14px; font-weight: 600; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #fbbf24; }
    button.calc-btn {
      width: 100%;
      background: #fbbf24;
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    button.calc-btn:hover { background: #f59e0b; }
    .result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #0f172a;
      border-radius: 8px;
      border-left: 4px solid #fbbf24;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 15px;
    }
    .badge-warn {
      background: #ef444422;
      color: #f87171;
      padding: 6px 12px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 13px;
      border: 1px solid #ef444444;
    }
    .badge-good {
      background: #22c55e22;
      color: #4ade80;
      padding: 6px 12px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 13px;
      border: 1px solid #22c55e44;
    }
    .cta {
      margin-top: 24px;
      text-align: center;
      border-top: 1px solid #334155;
      padding-top: 20px;
    }
    .wa-btn {
      display: inline-block;
      width: 100%;
      background: #22c55e;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>✨ Pronology Name Analyzer</h1>
  <p class="desc">Discover your Chaldean compound vibration & sound balance</p>

  <label>Enter Name to Analyze:</label>
  <input type="text" id="name" placeholder="e.g. Rahul Sharma" />
  <button class="calc-btn" onclick="checkName()">Analyze Vibrations</button>

  <div id="output" class="result">
    <div class="stat-row"><span>Chaldean Compound Number:</span><strong id="compNum" style="color:#fbbf24;">-</strong></div>
    <div class="stat-row"><span>Root Single Digit:</span><strong id="rootNum" style="color:#fbbf24;">-</strong></div>
    <div id="patternAlert"></div>
  </div>

  <div class="cta">
    <p style="font-size: 14px; color: #94a3b8; margin: 0 0 10px 0;">Need a lucky baby name or business name correction?</p>
    <!-- Change 919876543210 to your real WhatsApp number with country code -->
    <a href="https://wa.me/919876543210?text=Hi,%20I%20checked%20my%20name%20on%20your%20website%20and%20want%20a%20full%20Pronology%20consultation" class="wa-btn" target="_blank">
      💬 Consult on WhatsApp
    </a>
  </div>
</div>

<script>
  const map = {
    A:1, I:1, J:1, Q:1, Y:1,
    B:2, K:2, R:2,
    C:3, G:3, L:3, S:3,
    D:4, M:4, T:4,
    E:5, H:5, N:5, X:5,
    U:6, V:6, W:6,
    O:7, Z:7,
    F:8, P:8
  };

  const alertSounds = ["WAR", "DIE", "DI", "END", "NO", "NIL", "LESS", "ILL", "FALL", "LOST", "RUN", "DOWN"];

  function checkName() {
    const val = document.getElementById("name").value.trim().toUpperCase();
    if (!val) return;

    let compound = 0;
    for (let char of val) {
      if (map[char]) compound += map[char];
    }

    let root = compound;
    while (root > 9) {
      root = String(root).split('').reduce((a, b) => Number(a) + Number(b), 0);
    }

    const detected = alertSounds.filter(s => val.includes(s));

    document.getElementById("compNum").textContent = compound;
    document.getElementById("rootNum").textContent = root;

    const alertDiv = document.getElementById("patternAlert");
    if (detected.length > 0) {
      alertDiv.innerHTML = `<div class="badge-warn">⚠️ Warning sounds detected: <strong>${detected.join(", ")}</strong><br>These phonetic patterns may bring unexpected friction. A spelling alignment is advised.</div>`;
    } else {
      alertDiv.innerHTML = `<div class="badge-good">✅ Positive Sound Flow: No major negative sound blockages found.</div>`;
    }

    document.getElementById("output").style.display = "block";
  }
</script>

</body>
</html>
